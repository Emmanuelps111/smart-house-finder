<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing you in… — MakaziLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="/css/styles.css" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3661788889705570"
     crossorigin="anonymous"></script>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-family:Inter,system-ui,sans-serif;">
  <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:#3B82F6;"></i>
  <p id="msg" style="color:#374151;">Finishing sign-in…</p>
</div>
<script src="/js/data.js"></script>
<script src="/js/cloud.js"></script>
<script>
function askForStudentId(sb, uid) {
  return new Promise(() => {
    const box = document.getElementById('msg').parentElement;
    box.innerHTML = `
      <div style="max-width:26rem;width:92%;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:1.6rem;box-shadow:0 20px 50px rgba(15,23,42,.08);text-align:center;">
        <i class="fas fa-id-badge" style="font-size:2.4rem;color:#3B82F6;"></i>
        <h2 style="margin:.6rem 0 .3rem;">Upload your Student ID</h2>
        <p style="color:#64748b;font-size:.92rem;margin:0 0 1rem;">You signed up with a personal email, so our team will check your Student ID. This usually takes less than a day.</p>
        <input id="sid" type="file" accept="image/*" style="width:100%;margin-bottom:.8rem;" />
        <p id="sidErr" style="color:#ef4444;font-size:.85rem;min-height:1em;margin:0 0 .6rem;"></p>
        <button id="sidBtn" class="btn btn-primary" style="width:100%;">Submit for review</button>
        <a href="/listings.html" style="display:block;margin-top:.8rem;font-size:.85rem;color:#64748b;">Skip for now — browse listings</a>
      </div>`;
    document.getElementById('sidBtn').onclick = async () => {
      const f = document.getElementById('sid').files?.[0];
      const err = document.getElementById('sidErr');
      if (!f) { err.textContent = 'Choose a photo of your Student ID.'; return; }
      if (f.size > 5*1024*1024) { err.textContent = 'File must be under 5MB.'; return; }
      const btn = document.getElementById('sidBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
      const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${uid}/student-id-${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('property-photos').upload(path, f, { contentType: f.type || 'image/jpeg', upsert: true });
      if (error) { err.textContent = 'Upload failed. Check your connection and try again.'; btn.disabled = false; btn.textContent = 'Submit for review'; return; }
      const { data: pub } = sb.storage.from('property-photos').getPublicUrl(path);
      await sb.from('profiles').update({ student_id_url: pub.publicUrl }).eq('id', uid);
      box.innerHTML = '<div style="text-align:center;max-width:26rem;"><i class="fas fa-circle-check" style="font-size:2.6rem;color:#10b981;"></i><h2>Submitted for review</h2><p style="color:#64748b;">We\'ll notify you once approved. You can browse listings meanwhile.</p><a class="btn btn-primary" href="/listings.html">Browse listings</a></div>';
    };
  });
}
(async function () {
  const msg = document.getElementById('msg');
  try {
    const sb = await window.SHFCloud.ready;
    // Wait a moment for session to hydrate from URL hash
    let attempts = 0;
    let session = null;
    while (attempts++ < 20) {
      const { data } = await sb.auth.getSession();
      if (data.session) { session = data.session; break; }
      await new Promise(r => setTimeout(r, 150));
    }
    if (!session) {
      msg.textContent = 'Sign-in failed. Redirecting to login…';
      setTimeout(() => location.href = '/login.html', 1200);
      return;
    }

    const uid = session.user.id;
    const meta = session.user.user_metadata || {};
    const email = (session.user.email || '').toLowerCase();

    // Check assigned role
    const { data: roles } = await sb.from('user_roles').select('role').eq('user_id', uid);
    const role = roles && roles.length ? roles[0].role : null;

    // First-time student confirmations: auto-approve profile + persist metadata.
    // Guarded to student role so landlords still go through OCR verification.
    if (role === 'student') {
      try {
        const { data: prof } = await sb.from('profiles')
          .select('verification_status, phone, university, student_reg_no, home_campus, student_id_url')
          .eq('id', uid)
          .maybeSingle();
        const dom = email.split('@')[1] || '';
        const institutional = (window.SHF.UNIVERSITIES || []).some(u => u.domains.includes(dom));
        const update = {};
        if (!prof?.phone && meta.phone) update.phone = meta.phone;
        if (!prof?.university && meta.university) update.university = meta.university;
        if (!prof?.student_reg_no && meta.student_reg_no) update.student_reg_no = meta.student_reg_no;
        if (!prof?.home_campus && meta.home_campus) update.home_campus = meta.home_campus;
        if (institutional && (!prof || prof.verification_status !== 'approved')) {
          msg.textContent = 'Activating your student account…';
        }
        if (Object.keys(update).length) await sb.from('profiles').update(update).eq('id', uid);
        if (institutional) { const { data: st } = await sb.rpc('auto_verify_self'); if (prof && st === 'approved') prof.verification_status = 'approved'; }

        try {
          const raw = localStorage.getItem('shf-pending-secq');
          if (raw) {
            const stash = JSON.parse(raw);
            if (stash && stash.email === email && stash.question && stash.answer) {
              await sb.rpc('set_security_question', { _question: stash.question, _answer: stash.answer });
            }
            localStorage.removeItem('shf-pending-secq');
          }
        } catch (_) {}

        // Personal-email students: collect Student ID for admin review.
        if (!institutional && prof?.verification_status !== 'approved' && !prof?.student_id_url) {
          await window.SHFCloud.syncLocalUser(sb, session);
          await askForStudentId(sb, uid);
          return;
        }
      } catch (e) { console.warn('student setup skipped:', e); }
    }

    await window.SHFCloud.syncLocalUser(sb, session);

    if (!role) {
      // First-time OAuth user — pick role
      msg.textContent = 'Almost there — one quick step…';
      location.href = '/select-role.html';
      return;
    }
    msg.textContent = 'Welcome back!';
    const target = role === 'admin' ? '/admin'
      : role === 'landlord' ? '/dashboard.html'
      : '/listings.html';
    setTimeout(() => location.href = target, 400);
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong.';
    setTimeout(() => location.href = '/login.html', 1500);
  }
})();
</script>
</body>
</html>
